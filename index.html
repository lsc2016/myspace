<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공간">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>나의 공간</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="config.js"></script>
<style>
/* 레이아웃: 위 제목줄 · 그 아래 탭(장소|지도|날짜) · 가운데 화면. 휴대폰 우선, 넓은 화면은 가운데 정렬 */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#18221F; --muted:#66736E; --line:#E1E6E3;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --soft:#E6F0EC; --warn:#B45309; --danger:#B42318;
  --shadow:0 8px 28px rgba(16,32,28,.14);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101614; --surface:#18201D; --ink:#E7EEEB; --muted:#93A29C; --line:#28332F;
  --accent:#4FB394; --accent-ink:#0B1411; --soft:#1F2D28; --warn:#F59E0B; --danger:#F97066;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sync{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.sync.ok::before{content:"● ";color:var(--accent)}
.sync.warn::before{content:"● ";color:var(--warn)}
.icon{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 6px;border-radius:8px;color:var(--muted)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:0 16px 120px}
.view.mapview{padding:0;overflow:hidden}

/* 검색 · 분류 칩 */
.searchbar input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 12px;font-size:14px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip small{color:var(--muted);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on small{color:inherit;opacity:.7}
.listhead{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 2px 8px}
.listhead select{border:0;background:transparent;color:var(--muted);font-size:13px}

/* 장소 목록 */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.selbar{position:sticky;top:0;z-index:4;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-weight:600}
.selbar span{flex:1}
.selbar .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.3)}
.selbar .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.selbar .btn.danger{color:#FCA5A5}
.pitem .ck{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--accent)}
.pitem.checked{border-color:var(--accent);background:var(--soft)}
.pitem{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer}
.pitem .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none}
.pitem .body{min-width:0;flex:1}
.pitem .name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.pitem .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .meta{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.pitem .meta b{color:var(--accent);font-weight:600}
.stars{color:#E0A100;letter-spacing:1px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.7}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.psection{list-style:none;font-size:12px;font-weight:700;color:var(--muted);padding:10px 4px 4px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px}
.psection:first-child{border-top:0;margin-top:0;padding-top:0}
.psection small{background:var(--line);color:var(--ink);padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600}
.psection-empty{list-style:none;padding:12px 14px;color:var(--muted);font-size:13px;text-align:center;background:var(--surface);border-radius:12px;border:1px dashed var(--line)}
.psection-loading{list-style:none;padding:14px;color:var(--muted);font-size:13px;text-align:center}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 5px;border-radius:6px;vertical-align:middle;margin-left:6px}
.badge.mine{background:var(--line);color:var(--muted)}
.badge.visited{background:var(--soft);color:var(--accent)}
.badge.ext{background:var(--soft);color:var(--accent)}
.ext-cat{display:inline-block;font-size:11px;font-weight:600;color:var(--muted)}

/* 추천 장소 카드 */
.rec-item{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rec-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.rec-meta{display:flex;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.rec-reason{background:var(--soft);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.45}
.rec-reason b{color:var(--accent)}
.rec-price{display:inline-block;color:var(--warn);font-weight:600;font-size:12px}
.rec-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.guide-box{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin:8px 0;color:var(--ink)}
.guide-box ol{margin:4px 0 0;padding-left:18px}
.guide-box li{margin-bottom:2px}

/* 지도 */
#map{position:absolute;inset:0}
.mapchips{position:absolute;top:0;left:0;right:0;z-index:5;padding:8px 12px}
.mapchips .chip{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.banner{position:absolute;z-index:6;top:8px;left:12px;right:12px;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.banner span{flex:1;font-weight:600}
.banner button{border:0;background:transparent;color:inherit;opacity:.8}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px;color:var(--muted);line-height:1.7}
.pickbar{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.pickbar .addr{flex:1;min-width:0;font-size:14px}
.pickbar .addr small{display:block;color:var(--muted)}
.pin{position:relative;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
.pin .lbl{position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;
  color:#18221F;background:rgba(255,255,255,.92);padding:1px 6px;border-radius:6px;display:none}
.showlabels .pin .lbl{display:block}
.npin{width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;
  justify-content:center;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);position:relative;cursor:pointer}
.npin .lbl{position:absolute;top:28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;
  color:#18221F;background:rgba(255,255,255,.92);padding:1px 6px;border-radius:6px}

/* 지도 현재 위치 버튼 및 내 위치 마커 */
.myloc-btn{position:absolute;z-index:7;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:transform .15s ease,background-color .15s ease}
.myloc-btn:active{transform:scale(.92);background:var(--soft)}
.myloc-btn.loading{cursor:wait;pointer-events:none;opacity:.8}
.myloc-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.my-pos-marker{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.my-pos-marker .pulse{position:absolute;width:100%;height:100%;border-radius:50%;background:rgba(37,99,235,.28);animation:pulse-anim 2s infinite ease-out}
.my-pos-marker .dot{width:14px;height:14px;border-radius:50%;background:#2563EB;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);position:relative;z-index:2}
@keyframes pulse-anim{
  0%{transform:scale(.7);opacity:.9}
  70%{transform:scale(2.2);opacity:0}
  100%{transform:scale(2.2);opacity:0}
}

/* 날짜 화면: 여행 묶음 목록 (왼쪽 기간 · 오른쪽 장소 묶음) */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.titem{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer}
.titem .when{flex:none;width:104px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.titem .when small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.titem .body{min-width:0;flex:1}
.titem .tn{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.titem .tp{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tc{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-top:4px;vertical-align:middle}
.tripsub{color:var(--muted);font-size:14px;margin:4px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tripsub .tag{margin-top:0}
.stops{margin-top:12px}
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;margin-bottom:6px;cursor:pointer}
.stop .no{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;
  justify-content:center;flex:none;margin-top:1px}
.stop .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .n{font-weight:700}
.stop .note{font-size:14px;color:var(--ink);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere}
.stop > div{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* 버튼 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.fab{position:fixed;z-index:20;right:max(16px,calc(50% - 364px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:13px 18px;box-shadow:var(--shadow)}
/* 탭: 제목줄 바로 아래 세그먼트 */
.tabs{display:flex;gap:2px;margin:0 16px 10px;padding:3px;background:var(--line);border-radius:12px;z-index:10}
.tabs button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:9px;font-weight:600;color:var(--muted);font-size:15px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,12,.45)}
.sheet-body{position:relative;width:100%;max-width:760px;max-height:92%;overflow:auto;background:var(--bg);
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sh-title{display:flex;align-items:flex-start;gap:8px}
.sh-title h2{margin:0;font-size:21px;flex:1;overflow-wrap:anywhere;text-wrap:balance}
.catpill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;
  background:var(--surface);border:1px solid var(--line)}
.catpill i{width:8px;height:8px;border-radius:50%}
.addr{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.memo{white-space:pre-wrap;overflow-wrap:anywhere}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.vrow:first-of-type{border-top:0}
.vrow .vd{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .vn{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.vrow button{border:0;background:transparent;color:var(--muted);padding:0 4px}
.cdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;flex:none;align-self:center}
.cdot.big{width:30px;height:30px}
.cdot.on{box-shadow:0 0 0 3px var(--ink)}
.rate button{border:0;background:transparent;font-size:24px;padding:0 2px;color:var(--line)}
.rate button.on{color:#E0A100}
.go{position:sticky;bottom:0;background:var(--bg);padding-top:12px;margin-top:12px}
.go .main{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;border-radius:14px;padding:15px}
.go .others{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.go .others button{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 6px}

/* 입력 양식 */
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{display:flex;gap:8px}.sbox input{flex:1;min-width:0}
.results{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.results li{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.results li:first-child{border-top:0}
.results li small{display:block;color:var(--muted)}
.results li.picked{background:var(--soft)}
.picked-box{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.actions{display:flex;gap:8px;margin-top:18px}
.actions .btn{flex:1}
.bulk li{display:flex;gap:10px;align-items:flex-start}
.bulk li input{margin-top:4px}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:var(--shadow);max-width:90%}
[hidden]{display:none!important}
/* 가로로 넓은 화면(아이패드 가로 등): 왼쪽 목록·날짜, 오른쪽 큰 지도 */
body.wide .app{max-width:none;display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto auto 1fr}
body.wide .top{grid-column:1;grid-row:1}
body.wide .tabs{grid-column:1;grid-row:2}
body.wide main{grid-column:1;grid-row:3}
body.wide .tabs button[data-tab="map"]{display:none}
body.wide #view-map{position:fixed;left:400px;top:0;right:0;bottom:0;border-left:1px solid var(--line)}
body.wide #view-map[hidden]{display:block!important}
body.wide #mapCats{display:none}
body.wide .pickbar{bottom:16px;max-width:520px}
body.wide .myloc-btn{right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.wide .fab{right:auto;left:384px;transform:translateX(-100%)}
body.wide .sheet{justify-content:flex-start}
body.wide .sheet-body{max-width:420px;height:100%;max-height:100%;border-radius:0}
body.wide .toast{left:200px}
@media (prefers-reduced-motion:no-preference){.sheet-body{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>나의 공간</h1>
    <span id="sync" class="sync"></span>
    <button id="btnSettings" class="icon" aria-label="설정">⋯</button>
  </header>
  <nav class="tabs">
    <button data-tab="list" class="on">장소</button>
    <button data-tab="map">지도</button>
    <button data-tab="date">날짜</button>
  </nav>
  <main>
    <section id="view-list" class="view">
      <div class="searchbar"><input id="q" type="search" placeholder="장소·목적지 검색 (내 장소 + 새로운 곳)"></div>
      <div id="cats" class="chips"></div>
      <div class="listhead"><span id="count"></span>
        <span class="row" style="gap:6px;align-items:center"><button class="btn small" id="selToggle">선택</button>
        <select id="sort" aria-label="정렬">
          <option value="recent">최근 추가순</option>
          <option value="visit">최근 방문순</option>
          <option value="name">이름순</option>
          <option value="rating">별점순</option>
        </select></span>
      </div>
      <div id="selBar" class="selbar" hidden>
        <span id="selCount">0곳 선택</span>
        <button class="btn small" id="selAll">전체 선택</button>
        <button class="btn small primary" id="selCat">분류 바꾸기</button>
        <button class="btn small danger" id="selDel">삭제</button>
      </div>
      <ul id="list" class="plist"></ul>
    </section>
    <section id="view-map" class="view mapview" hidden>
      <div id="map"></div>
      <div id="mapCats" class="chips mapchips"></div>
      <div id="routeBanner" class="banner" hidden></div>
      <div id="mapMsg" class="mapmsg" hidden></div>
      <div id="pickBar" class="pickbar" hidden></div>

<script>
'use strict';
/* ───────── 기본 ───────── */
const CFG = Object.assign({KAKAO_JS_KEY:'', SCRIPT_URL:'', TOKEN:''}, window.APP_CONFIG || {});
/* 저장소 연결: 처음 한 번 "연결 링크"(?connect=...)로 열면 이 기기에 기억됨 — 주소·암호를 공개 코드에 두지 않기 위함 */
(function(){
  try{
    const qs = new URLSearchParams(location.search), c = qs.get('connect');
    if(c){
      const j = JSON.parse(decodeURIComponent(escape(atob(c.replace(/-/g,'+').replace(/_/g,'/')))));
      if(j.u && j.t) localStorage.setItem('ms-conn', JSON.stringify({u:j.u, t:j.t}));
      history.replaceState(null, '', location.pathname);
    }
    const s = JSON.parse(localStorage.getItem('ms-conn') || 'null');
    if(s && !CFG.SCRIPT_URL){ CFG.SCRIPT_URL = s.u; CFG.TOKEN = s.t; }
  }catch(e){}
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const nowIso = () => new Date().toISOString();
const WD = ['일','월','화','수','목','금','토'];
function prettyDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); const w=WD[new Date(y,m-1,d).getDay()]; return `${y}. ${m}. ${d}. (${w})`; }
function shortDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return (y===new Date().getFullYear()?'':y+'. ')+`${m}. ${d}.`; }

const DEFAULT_CATS = ['집','카페','음식점','관광지','마트','기타'];
const CAT_COLORS = {'집':'#0F766E','카페':'#B7791F','음식점':'#D1495B','관광지':'#2E86AB','마트':'#5E8C3A','기타':'#8E7DBE'};
const EXTRA = ['#C2410C','#0F766E','#7C3AED','#BE185D','#4D7C0F','#1D4ED8','#A16207'];
const PALETTE = ['#B7791F','#D1495B','#2E86AB','#5E8C3A','#8E7DBE','#C2410C','#0F766E','#7C3AED','#BE185D','#1D4ED8','#A16207','#64748B'];
/* 분류 목록(이름·색·순서) — 구글 시트 places에 id "__cats__" 줄 하나로 같이 저장됨 */
const CATS_ID = '__cats__';
let cats = DEFAULT_CATS.map(n => ({name:n, color:CAT_COLORS[n]}));
function catColor(c){ const f = cats.find(x => x.name === c); if(f && f.color) return f.color; if(CAT_COLORS[c]) return CAT_COLORS[c]; let h=0; for(const ch of (c||'')) h=(h*31+ch.charCodeAt(0))>>>0; return EXTRA[h%EXTRA.length]; }
/* 여행 목록(이름·시작일·종료일·메모) — 분류와 같은 방식으로 places에 id "__trips__" 줄 하나로 저장 */
const TRIPS_ID = '__trips__';
let trips = [];
const normT = t => ({ id:String(t.id), name:String(t.name||''), start:String(t.start||''), end:String(t.end||t.start||''), note:String(t.note||'') });
const isMeta = p => p.id === CATS_ID || p.id === TRIPS_ID;
let catsSaved = false;   // 저장된 분류 목록을 불러왔는지
/* 시트에서 받은 places 중 설정 줄(분류·여행)을 떼어 내고 진짜 장소만 돌려줌 */
function splitMeta(arr){
  const row = arr.find(p => p.id === CATS_ID); catsSaved = false;
  if(row){ try{ const j = JSON.parse(row.memo); if(Array.isArray(j) && j.length){ cats = j.map(x => ({name:String(x.name), color:String(x.color||'')})); catsSaved = true; } }catch(e){} }
  const tr = arr.find(p => p.id === TRIPS_ID); trips = [];
  if(tr){ try{ const j = JSON.parse(tr.memo); if(Array.isArray(j)) trips = j.map(normT).filter(t => t.start); }catch(e){} }
  return arr.filter(p => !isMeta(p));
}
const metaRows = () => [normP({id:CATS_ID, name:'(분류 설정)', memo:JSON.stringify(cats)}), normP({id:TRIPS_ID, name:'(여행 목록)', memo:JSON.stringify(trips)})];
/* "집"이 기본 분류 첫째로 추가되기 전에 저장된 목록에도 한 번만 "집"을 맨 앞에 넣어 줌 (이후 사용자가 옮기거나 지우면 그대로 둠) */
function homeFirst(){
  if(!catsSaved || lsGet('ms-home-first', false)) return;
  lsSet('ms-home-first', true);
  if(cats[0] && cats[0].name === '집') return;
  const old = cats.find(c => c.name === '집');
  cats = [old || {name:'집', color:CAT_COLORS['집']}, ...cats.filter(c => c.name !== '집')];
  saveCats();
}
function saveCats(){
  const t = nowIso();
  const row = normP({id:CATS_ID, name:'(분류 설정)', category:'', memo:JSON.stringify(cats), createdAt:t, updatedAt:t});
  saveLocal(); queue('upsertPlace', row); renderAll();
}
function saveTrips(){
  const t = nowIso();
  const row = normP({id:TRIPS_ID, name:'(여행 목록)', category:'', memo:JSON.stringify(trips), createdAt:t, updatedAt:t});
  saveLocal(); queue('upsertPlace', row); renderAll();
}
const KAKAO_GROUP = {CE7:'카페', FD6:'음식점', AT4:'관광지', MT1:'마트', CS2:'마트'};
function mapKakaoCategory(d){
  if(d.category_group_code && KAKAO_GROUP[d.category_group_code]) return KAKAO_GROUP[d.category_group_code];
  const full = d.category_name || '';
  if(/카페|커피|디저트/i.test(full)) return '카페';
  if(/음식점|식당|베이커리|맛집|술집|주점|분식/i.test(full)) return '음식점';
  if(/마트|슈퍼|편의점|백화점|시장/i.test(full)) return '마트';
  if(/관광|명소|공원|휴양|문화/i.test(full)) return '관광지';
  if(/숙박|호텔|펜션|모텔/i.test(full)) return '숙소';
  return '기타';
}
const NAVS = {tmap:'티맵', naver:'네이버 내비', kakaonavi:'카카오내비', kakaomap:'카카오맵'};

function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ───────── 데이터 ───────── */
let places = [], visits = [], outbox = [];
/* route: 지도에 경로로 그릴 묶음 {key} (여행 id 또는 "d:날짜"), trip: 열려 있는 여행 상세의 key */
const S = { tab:'list', cat:'전체', tripFilter:'전체', q:'', sort: lsGet('ms-sort','recent'), route:null, trip:null, fit:true, extResults:[], extLoading:false, recResults:[], recLoading:false, recError:null, recCat:null, myCoords:null };

const numOrNull = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const normP = p => ({ id:String(p.id), name:String(p.name||''), category:String(p.category||''), address:String(p.address||''),
  lat:numOrNull(p.lat), lng:numOrNull(p.lng), phone:String(p.phone||''), url:String(p.url||''), memo:String(p.memo||''),
  rating:Number(p.rating)||0, createdAt:String(p.createdAt||''), updatedAt:String(p.updatedAt||'') });
const normV = v => ({ id:String(v.id), placeId:String(v.placeId), date:String(v.date||''), time:String(v.time||''),
  note:String(v.note||''), createdAt:String(v.createdAt||''), updatedAt:String(v.updatedAt||'') });

function loadLocal(){ const d=lsGet('ms-data',{places:[],visits:[]}); places=splitMeta((d.places||[]).map(normP)); visits=(d.visits||[]).map(normV); outbox=lsGet('ms-outbox',[]); cats.forEach(c=>{ if(!c.color) c.color = catColor(c.name); }); }
function saveLocal(){ lsSet('ms-data',{places:[...places, ...metaRows()],visits}); lsSet('ms-outbox',outbox); }
const placeById = id => places.find(p => p.id === id);

/* ───────── 저장소(구글 시트) 동기화 ───────── */
const online = () => !!(CFG.SCRIPT_URL && CFG.TOKEN);
function setSync(t, cls){ const el=$('#sync'); el.textContent=t; el.className='sync '+(cls||''); }
async function api(payload){
  const r = await fetch(CFG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:CFG.TOKEN, ...payload})});
  const d = await r.json(); if(d.error) throw new Error(d.error); return d;
}
function queue(action, data){ outbox.push({action, data}); saveLocal(); flush(); }
let flushing = false;
async function flush(){
  if(!online()){ setSync('이 기기에만 저장','warn'); return; }
  if(flushing) return; flushing = true;
  try{
    while(outbox.length){ setSync('저장 중…'); await api(outbox[0]); outbox.shift(); saveLocal(); }
    setSync('저장됨','ok');
  }catch(e){ setSync(`저장 대기 ${outbox.length}건`,'warn'); }
  flushing = false;
}
async function pull(){
  if(!online()){ setSync('이 기기에만 저장','warn'); return; }
  await flush(); if(outbox.length) return;
  try{
    setSync('불러오는 중…');
    const r = await fetch(CFG.SCRIPT_URL + '?token=' + encodeURIComponent(CFG.TOKEN));
    const d = await r.json(); if(d.error) throw new Error(d.error);
    places = splitMeta((d.places||[]).map(normP)); visits = (d.visits||[]).map(normV); homeFirst();
    saveLocal(); renderAll(); setSync('동기화됨','ok');
  }catch(e){ setSync('저장소 연결 안 됨','warn'); }
}

function savePlace(p){
  p.updatedAt = nowIso(); if(!p.createdAt) p.createdAt = p.updatedAt;
  const i = places.findIndex(x => x.id === p.id); if(i < 0) places.push(p); else places[i] = p;
  saveLocal(); queue('upsertPlace', p); renderAll();
}
function deletePlace(id){
  places = places.filter(p => p.id !== id); visits = visits.filter(v => v.placeId !== id);
  saveLocal(); queue('deletePlace', {id}); renderAll();
}
function saveVisit(v){
  v.updatedAt = nowIso(); if(!v.createdAt) v.createdAt = v.updatedAt;
  const i = visits.findIndex(x => x.id === v.id); if(i < 0) visits.push(v); else visits[i] = v;
  saveLocal(); queue('upsertVisit', v); renderAll();
}
function deleteVisit(id){ visits = visits.filter(v => v.id !== id); saveLocal(); queue('deleteVisit', {id}); renderAll(); }
function importMany(ps, vs){
  ps = ps.filter(p => !isMeta(p));
  ps.forEach(p => { const i=places.findIndex(x=>x.id===p.id); if(i<0) places.push(p); else places[i]=p; });
  vs.forEach(v => { const i=visits.findIndex(x=>x.id===v.id); if(i<0) visits.push(v); else visits[i]=v; });
  saveLocal(); queue('importAll', {places:ps, visits:vs}); renderAll();
}

/* ───────── 화면 공통 ───────── */
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2600); }
function openSheet(html){ $('#sheetBody').innerHTML = '<div class="grab"></div>' + html; $('#sheet').hidden = false; $('#sheetBody').scrollTop = 0; }
function closeSheet(){ $('#sheet').hidden = true; $('#sheetBody').innerHTML = ''; }
$('#sheet').addEventListener('click', e => { if(e.target.matches('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function stats(){
  const t = today(), m = {};
  for(const v of visits){ const s = m[v.placeId] || (m[v.placeId] = {n:0, last:'', next:''});
    if(v.date <= t){ s.n++; if(v.date > s.last) s.last = v.date; } else if(!s.next || v.date < s.next) s.next = v.date; }
  return m;
}
function allCats(){ const s = new Set(cats.map(c => c.name)); places.forEach(p => p.category && s.add(p.category)); return [...s]; }
function filtered(){
  const q = S.q.trim().toLowerCase();
  return places.filter(p => (S.cat === '전체' || p.category === S.cat) &&
    (!q || [p.name, p.address, p.memo, p.category].join(' ').toLowerCase().includes(q)));
}
const starText = r => r ? '★'.repeat(r) + '☆'.repeat(5 - r) : '';

/* ───────── 추천 기준 (criteria.md) 및 선별 로직 ───────── */
const DEFAULT_CRITERIA = `# 나의 공간 추천 기준 (criteria.md)

카테고리별 한 줄 기준으로 현재 위치 근처 가게 후보 중 가장 알맞은 3곳을 agy가 선별합니다.

- 집 — 현재 위치 반경 1km 이내, 편안하게 쉬어갈 수 있는 아늑한 공간
- 카페 — 반경 1km 이내, 대화하기 좋고 편안한 분위기, 작업이나 휴식이 가능한 곳, 평점 및 커피 맛이 검증된 곳
- 음식점 — 반경 1.5km 이내, 깔끔하고 가성비 좋은 식사, 혼밥 또는 동행과 가기 편안한 맛집, 위생과 친절도가 좋은 곳
- 미용실 — 반경 2km 이내, 친절하고 과도한 영업 권유가 없는 곳, 1:1 맞춤 케어 또는 실력 있는 디자이너, 합리적인 시술 가격
- 관광지 — 반경 3km 이내, 산책이나 나들이하기 좋은 명소, 경치가 좋고 쾌적한 쉼터
- 마트 — 반경 1.5km 이내, 장보기가 편리하고 신선 식품과 생필품 구비가 잘 된 대형마트 또는 슈퍼마켓
- 기타 — 반경 2km 이내, 이용 만족도가 높고 평이 좋은 친절한 매장`;

function getCriteriaText(){
  return lsGet('ms-criteria', null) || DEFAULT_CRITERIA;
}

function parseCriteria(mdText){
  const map = {};
  const lines = (mdText || '').split('\n');
  for(let line of lines){
    line = line.trim();
    if(!line.startsWith('-')) continue;
    const clean = line.replace(/^-\s*/, '');
    const parts = clean.split(/—|--|-/).map(s => s.trim());
    if(parts.length < 2) continue;
    const catName = parts[0];
    const condText = parts.slice(1).join(' — ');
    let radius = 2000;
    const rm = condText.match(/반경\s*([0-9.]+)\s*km/i);
    if(rm) radius = Math.round(parseFloat(rm[1]) * 1000);
    map[catName] = { category: catName, condition: condText, radius };
  }
  return map;
}

function calcDistance(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return Math.round(R * c);
}

function fmtDistance(m){
  if(m == null || isNaN(m)) return '';
  return m < 1000 ? `${m}m` : `${(m / 1000).toFixed(1)}km`;
}

/* 내 기록에서 추천: 별점·방문 기록·거리로 내 장소 중 3곳을 고른다 */
function daysAgo(d){ if(!d) return null; const [y,m,dd]=d.split('-').map(Number); return Math.round((Date.now() - new Date(y,m-1,dd)) / 86400000); }
function agoText(n){ return n < 30 ? `${n}일 전` : n < 365 ? `${Math.round(n/30)}달 전` : `${Math.round(n/365)}년 전`; }
function myPicks(arr){
  const st = stats(), me = S.myCoords, out = [];
  for(const p of arr){
    const s = st[p.id] || {};
    if(s.next || p.category === '집') continue;            // 갈 예정인 곳과 집은 빼기
    const dist = (me && p.lat != null) ? calcDistance(me.lat, me.lng, p.lat, p.lng) : null;
    const near = dist != null && dist <= 2000;
    const ago = daysAgo(s.last);
    let score = 0, why = [];
    if(p.rating >= 4 && s.n && ago >= 60){ score += 40 + p.rating * 4 + Math.min(ago, 365) / 30; why.push(`${starText(p.rating)} 준 곳인데 ${agoText(ago)}에 마지막으로 갔어요`); }
    else if(!s.n){ score += 25 + p.rating * 3; why.push(p.rating ? `${starText(p.rating)} · 저장만 하고 아직 안 가봤어요` : '저장만 하고 아직 안 가봤어요'); }
    if(near && !(ago != null && ago < 14)){ score += 30 * (1 - dist / 2000) + 5; why.push(`여기서 ${fmtDistance(dist)}`); }
    if(!score) continue;
    out.push({ p, score, why: why.join(' · ') });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 3);
}

/* 카카오 업종 코드 (글자 검색보다 정확) */
const CAT_GROUP = {카페:'CE7', 음식점:'FD6', 관광지:'AT4', 마트:'MT1', 숙소:'AD5'};

/* 사실만 담은 추천 이유: 거리 · 세부 종류 · 내가 좋아한 곳과 같은 종류인지 */
function factReason(dist, subCat, liked){
  const bits = [`여기서 ${fmtDistance(dist)}`];
  if(subCat) bits.push(subCat);
  if(liked) bits.push(`내가 ${starText(liked.rating)} 준 '${liked.name}'과 같은 ${subCat}`);
  return bits.join(' · ');
}

function filterAndRankRecommendations(category, candidates, userLat, userLng, criteriaText, savedPlaces){
  if(!Array.isArray(candidates) || !candidates.length) return [];
  const criteriaMap = parseCriteria(criteriaText);
  const crit = criteriaMap[category] || { category, condition: '반경 2km 이내, 만족도가 높은 곳', radius: 2000 };
  const maxRadius = crit.radius;
  const scored = [];
  /* 같은 분류에서 내가 ★4 이상 준 곳 — 이름에 세부 종류(국밥, 베이커리…)가 들어가면 비슷한 곳으로 본다 */
  const liked = (savedPlaces || []).filter(p => p.category === category && p.rating >= 4);

  candidates.forEach((c, rank) => {
    const cLat = Number(c.y || c.lat);
    const cLng = Number(c.x || c.lng);
    if(isNaN(cLat) || isNaN(cLng)) return;

    let dist;
    if(c.distance != null && String(c.distance).trim() !== '' && !isNaN(Number(c.distance))){
      dist = Math.round(Number(c.distance));
    } else {
      dist = calcDistance(userLat, userLng, cLat, cLng);
    }

    if(dist > maxRadius * 1.2) return;

    const distScore = Math.max(0, (1 - (dist / maxRadius)) * 50);
    let kwScore = 30 - rank;                               // 카카오 정확도 순위가 높을수록 가산
    const pname = c.place_name || c.name || '';
    const catName = c.category_name || '';
    const combined = `${pname} ${catName}`.toLowerCase();

    if(category === '미용실' && /헤어|미용실|바버|살롱/.test(combined)) kwScore += 15;
    else if(category === '카페' && /카페|커피|디저트|베이커리|로스터/.test(combined)) kwScore += 15;
    else if(category === '음식점' && /음식|식당|맛집|한식|일식|양식|중식/.test(combined)) kwScore += 15;

    const subCat = catName.includes('>') ? catName.split('>').pop().trim() : '';
    const like = subCat ? liked.find(p => p.name.includes(subCat)) : null;
    const totalScore = distScore + kwScore + (like ? 25 : 0);

    const addr = c.road_address_name || c.address_name || c.address || '';
    let isSaved = false;
    let savedId = null;
    if(Array.isArray(savedPlaces)){
      for(const sp of savedPlaces){
        if((pname && sp.name === pname && (addr === sp.address || !sp.address)) ||
           (sp.lat != null && Math.abs(sp.lat - cLat) < 0.0001 && Math.abs(sp.lng - cLng) < 0.0001)){
          isSaved = true;
          savedId = sp.id;
          break;
        }
      }
    }

    if(isSaved) return;                                    // 이미 내 장소면 위 목록에 있으니 빼고 새 곳만
    const priceInfo = c.price || c.price_info || null;
    const reason = factReason(dist, subCat, like);

    scored.push({
      name: pname,
      distance: dist,
      distanceText: fmtDistance(dist),
      phone: c.phone || '',
      reason,
      url: c.place_url || `https://map.kakao.com/link/map/${encodeURIComponent(pname)},${cLat},${cLng}`,
      priceInfo,
      lat: cLat,
      lng: cLng,
      address: addr,
      category,
      isSaved,
      savedId,
      score: totalScore
    });
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 3);
}

let recSeq = 0;
async function fetchRecommendations(cat){
  if(!cat || cat === '전체' || cat === '집'){
    S.recResults = []; S.recCat = null; S.recLoading = false; S.recError = null;
    renderList();
    return;
  }
  const seq = ++recSeq;
  S.recCat = cat;
  S.recLoading = true;
  S.recError = null;
  S.recResults = [];
  renderList();

  // 1. 현재 위치 획득
  let lat = null, lng = null;
  if(S.myCoords && (Date.now() - S.myCoords.ts < 300000)){
    lat = S.myCoords.lat;
    lng = S.myCoords.lng;
  } else if(navigator.geolocation){
    try {
      const pos = await new Promise((res, rej) => {
        navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
      });
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
      S.myCoords = { lat, lng, ts: Date.now() };
    } catch(err){
      if(S.myCoords){
        lat = S.myCoords.lat;
        lng = S.myCoords.lng;
      } else {
        if(seq !== recSeq) return;
        S.recLoading = false;
        S.recError = '현재 위치를 가져올 수 없어 추천을 불러오지 못했어요. 브라우저 위치 권한을 확인해 주세요.';
        renderList();
        return;
      }
    }
  } else {
    if(seq !== recSeq) return;
    S.recLoading = false;
    S.recError = '이 기기에서는 위치 정보를 지원하지 않아요.';
    renderList();
    return;
  }

  // 2. 카카오 로컬 검색 후보 수집
  const restKey = lsGet('ms-kakao-key', '');
  const critMap = parseCriteria(getCriteriaText());
  const radius = (critMap[cat] && critMap[cat].radius) || 2000;
  let candidates = [];

  if(restKey){
    try {
      const code = CAT_GROUP[cat];
      const apiUrl = code
        ? `https://dapi.kakao.com/v2/local/search/category.json?category_group_code=${code}&x=${lng}&y=${lat}&radius=${radius}&size=15&sort=accuracy`
        : `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(cat)}&x=${lng}&y=${lat}&radius=${radius}&size=15&sort=accuracy`;
      const res = await fetch(apiUrl, { headers: { Authorization: `KakaoAK ${restKey}` } });
      if(res.ok){
        const data = await res.json();
        candidates = data.documents || [];
      } else {
        throw new Error('REST API error');
      }
    } catch(e){
      candidates = await searchViaSdk(cat, lat, lng, radius);
    }
  } else {
    candidates = await searchViaSdk(cat, lat, lng, radius);
  }

  if(seq !== recSeq) return;

  if(!candidates || !candidates.length){
    S.recLoading = false;
    S.recResults = [];
    if(!restKey && !svcPlaces){
      S.recError = '설정(⋯)에서 카카오 지역 검색 키(REST API)를 등록하시면 현재 위치 기준 최적의 가게를 추천받을 수 있어요.';
    } else {
      S.recError = null;
    }
    renderList();
    return;
  }

  // 3. agy 기준 선별 로직 수행
  const top3 = filterAndRankRecommendations(cat, candidates, lat, lng, getCriteriaText(), places);
  if(seq !== recSeq) return;
  S.recResults = top3;
  S.recLoading = false;
  S.recError = null;
  renderList();
}

function searchViaSdk(cat, lat, lng, radius){
  return new Promise(res => {
    if(!svcPlaces) return res([]);
    const opt = {
      location: new kakao.maps.LatLng(lat, lng),
      radius: radius || 2000,
      size: 15,
      sort: kakao.maps.services.SortBy.ACCURACY
    };
    const done = (data, status) => res(status === kakao.maps.services.Status.OK && Array.isArray(data) ? data : []);
    if(CAT_GROUP[cat]) svcPlaces.categorySearch(CAT_GROUP[cat], done, opt);
    else svcPlaces.keywordSearch(cat, done, opt);
  });
}

let qDebounceTimer = null, qSeq = 0;
async function doExtSearch(keyword){
  const q = keyword.trim();
  if(!q){
    S.extResults = []; S.extLoading = false; renderList(); return;
  }
  const seq = ++qSeq;
  S.extLoading = true;
  renderList();
  try{
    const r = await kakaoSearch(q);
    if(seq !== qSeq) return;
    S.extLoading = false;
    S.extResults = Array.isArray(r) ? r : [];
  }catch(e){
    if(seq !== qSeq) return;
    S.extLoading = false;
    S.extResults = [];
  }
  renderList();
}
function handleSearchInput(val){
  S.q = val;
  const trimmed = val.trim();
  if(!trimmed){
    clearTimeout(qDebounceTimer);
    S.extResults = [];
    S.extLoading = false;
    renderList();
    return;
  }
  renderList();
  clearTimeout(qDebounceTimer);
  qDebounceTimer = setTimeout(() => doExtSearch(trimmed), 400);
}
$('#q').addEventListener('input', e => handleSearchInput(e.target.value));
$('#q').addEventListener('search', e => handleSearchInput(e.target.value));
$('#q').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(qDebounceTimer);
    const trimmed = S.q.trim();
    if(trimmed) doExtSearch(trimmed);
  }
});

const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function recordNaviVisit(placeId){
  const t = today();
  const d = new Date();
  const tm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const existing = visits.find(v => v.placeId === placeId && v.date === t);
  if(existing){
    existing.time = tm;
    saveVisit(existing);
  } else {
    saveVisit({ id: uid(), placeId, date: t, time: tm, note: '' });
  }
  toast('내비 출발 장소를 오늘 방문 기록에 등록했어요');
  if(placeById(placeId)) openPlace(placeId);
}
async function go(p, app){
  if(p.lat == null && p.address){
    const c = await addrToCoord(p.address);
    if(c){ p.lat = c.lat; p.lng = c.lng; if(p.id) savePlace({...p}); }
  }
  if(p.lat == null){ toast('위치 정보가 없는 장소예요. "정보 고치기"에서 다시 검색해 주세요.'); return; }
  if(!p.id){
    p.id = uid();
    if(!p.createdAt) p.createdAt = nowIso();
    savePlace(p);
  }
  recordNaviVisit(p.id);
  const n = encodeURIComponent(p.name);
  if(!isMobile()){ window.open(`https://map.kakao.com/link/to/${n},${p.lat},${p.lng}`, '_blank'); return; }
  if(app === 'kakaonavi'){
    if(window.Kakao && Kakao.isInitialized && Kakao.isInitialized()){
      Kakao.Navi.start({name:p.name, x:p.lng, y:p.lat, coordType:'wgs84'}); return;
    }
    app = 'kakaomap';
  }
  const url = app === 'tmap' ? `tmap://route?rGoName=${n}&rGoX=${p.lng}&rGoY=${p.lat}`
    : app === 'naver' ? `nmap://navigation?dlat=${p.lat}&dlng=${p.lng}&dname=${n}&appname=${encodeURIComponent(location.hostname || 'myspace')}`
    : `kakaomap://route?ep=${p.lat},${p.lng}&by=CAR`;
  location.href = url;
}

/* ───────── 날짜 화면 (여행 묶음) ─────────
   날짜 기록이 어떤 여행 기간 안에 들면 그 여행에 속함. 겹치면 시작일이 늦은 쪽.
   어느 여행에도 안 들면 그 날짜 하나짜리 묶음(key "d:날짜"). */
const byWhen = (a,b) => a.date.localeCompare(b.date) || (a.time||'99').localeCompare(b.time||'99') || (a.createdAt||'').localeCompare(b.createdAt||'');
function tripOf(date){
  let best = null;
  for(const t of trips) if(t.start <= date && date <= t.end && (!best || t.start > best.start)) best = t;
  return best;
}
function tripGroups(){
  const g = {};
  trips.forEach(t => g[t.id] = {key:t.id, trip:t, start:t.start, end:t.end, vs:[]});
  visits.forEach(v => { if(!v.date) return; const t = tripOf(v.date);
    if(t) g[t.id].vs.push(v);
    else (g['d:' + v.date] = g['d:' + v.date] || {key:'d:' + v.date, trip:null, start:v.date, end:v.date, vs:[]}).vs.push(v); });
  const arr = Object.values(g); arr.forEach(x => x.vs.sort(byWhen));
  return arr.sort((a,b) => b.start.localeCompare(a.start) || b.end.localeCompare(a.end));
}
const groupByKey = key => tripGroups().find(x => x.key === key);
const placeName = v => { const p = placeById(v.placeId); return p ? p.name : '(지워진 장소)'; };
const groupTitle = g => (g.trip && g.trip.name) || (g.vs[0] ? placeName(g.vs[0]) : '이름 없는 여행');
const isPlanned = g => g.end > today();
/* 기간 글자: 같은 해 10/19 – 10/21, 하루 10/19, 다른 해 2025. 10/19 – 10/21 */
const md = s => { const [, m, d] = s.split('-').map(Number); return `${m}/${d}`; };
function rangeParts(a, b){
  const ya = a.slice(0,4), yb = b.slice(0,4), cy = String(new Date().getFullYear());
  if(ya !== yb) return {year:'', text:`${ya}. ${md(a)} – ${yb}. ${md(b)}`};
  return {year: ya === cy ? '' : ya + '.', text: a === b ? md(a) : `${md(a)} – ${md(b)}`};
}
const fmtRange = (a, b) => { const r = rangeParts(a, b); return (r.year ? r.year + ' ' : '') + r.text; };

function renderTrips(){

    return `<li class="titem" data-key="${esc(g.key)}"><div class="when">${r.year?`<small>${esc(r.year)}</small>`:''}${esc(r.text)}${isPlanned(g)?'<br><span class="tag">예정</span>':''}</div>

}

/* 여행 상세: 장소를 날짜·시간 순으로 번호 붙여 보여 줌. 넓은 화면이면 오른쪽 지도에 경로가 바로 그려짐 */
function openTrip(key){

  const body = $('#sheetBody');

      S.trip = null; saveTrips(); closeSheet(); toast('여행 묶음을 풀었어요 (날짜 기록은 남아 있어요)'); };
  } else body.querySelector('#trWrap').onclick = () => openTripEditor(null, {start:g.start, end:g.end});
  if(isWide()){ S.route = {key}; S.fit = true; renderMap(); }

/* 여행 추가 · 고치기 (종료일을 비우면 시작일과 같은 날) */
function openTripEditor(orig, prefill = {}){
  const t = orig ? {...orig} : normT({id:uid(), start: prefill.start || today(), end: prefill.end || ''});
  openSheet(`<div class="sh-title"><h2>${orig ? '여행 정보 고치기' : '여행 추가'}</h2></div>
    <div class="field"><label for="tName">이름</label><input id="tName" value="${esc(t.name)}" placeholder="예: 제주 가족여행, 강릉 1박"></div>
    <div class="two"><div class="field"><label for="tStart">시작일</label><input id="tStart" type="date" value="${esc(t.start)}"></div>
      <div class="field"><label for="tEnd">종료일</label><input id="tEnd" type="date" value="${esc(orig ? t.end : (prefill.end || ''))}"></div></div>
    <p class="hint">종료일을 비우면 하루짜리로 저장돼요. 이 기간에 있는 날짜 기록이 이 여행에 모여요.</p>
    <div class="field"><label for="tNote">메모</label><textarea id="tNote" placeholder="누구와, 숙소, 준비물…">${esc(t.note)}</textarea></div>
    <div class="actions"><button class="btn" id="tCancel">취소</button><button class="btn primary" id="tSave">저장</button></div>`);
  const body = $('#sheetBody');
  body.querySelector('#tCancel').onclick = () => orig ? openTrip(orig.id) : (prefill.start ? openTrip('d:' + prefill.start) : closeSheet());
  body.querySelector('#tSave').onclick = () => {
    t.name = body.querySelector('#tName').value.trim();
    t.start = body.querySelector('#tStart').value; if(!t.start){ toast('시작일을 골라 주세요'); return; }
    t.end = body.querySelector('#tEnd').value || t.start;
    if(t.end < t.start){ toast('종료일이 시작일보다 빨라요'); return; }
    t.note = body.querySelector('#tNote').value;
    const i = trips.findIndex(x => x.id === t.id); if(i < 0) trips.push(t); else trips[i] = t;

  };
  if(!orig) setTimeout(() => body.querySelector('#tName').focus(), 50);

/* 여행에 "＋ 장소 넣기" — 내 장소에서 고르면 날짜=여행 시작일로 바로 기록됨 (날짜·시간·메모는 나중에 그 기록을 눌러 고침) */

  body.querySelector('#ppDone').onclick = () => openTrip(key);
}

/* ───────── 지도 (카카오) ───────── */
let map = null, svcPlaces = null, geocoder = null, overlays = [], routeLine = null, tempOverlay = null, pickLatLng = null;
let myLocationOverlay = null, isLocating = false;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initKakao(){
  if(!CFG.KAKAO_JS_KEY){ mapMsg('카카오 지도 키가 아직 없어요.<br>config.js에 JavaScript 키를 넣으면 지도가 나옵니다.'); return; }
  try{
    await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(CFG.KAKAO_JS_KEY)}&libraries=services&autoload=false`);
    await new Promise(r => kakao.maps.load(r));
    svcPlaces = new kakao.maps.services.Places(); geocoder = new kakao.maps.services.Geocoder();
    map = new kakao.maps.Map($('#map'), {center: new kakao.maps.LatLng(37.5665, 126.978), level: 8});
    kakao.maps.event.addListener(map, 'click', e => onMapClick(e.latLng));
    kakao.maps.event.addListener(map, 'zoom_changed', labelMode);
    labelMode(); mapMsg(null);
    if(mapVisible()){ map.relayout(); renderMap(); }
  }catch(e){ mapMsg('카카오 지도를 불러오지 못했어요.<br>키와 등록한 사이트 주소, "카카오맵 사용 설정"을 확인해 주세요.'); }
  loadScript('https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js').then(() => { try{ if(!Kakao.isInitialized()) Kakao.init(CFG.KAKAO_JS_KEY); }catch(e){} }).catch(() => {});
}
function mapMsg(h){ const el = $('#mapMsg'); el.hidden = !h; if(h) el.innerHTML = h; }
function labelMode(){ if(map) $('#map').classList.toggle('showlabels', map.getLevel() <= 6); }
function kakaoSearch(q){
  return new Promise(res => {
    if(!svcPlaces) return res(null);
    const opt = {size: 15}; if(map) opt.location = map.getCenter();
    svcPlaces.keywordSearch(q, (data, status) => {
      const kw = status === kakao.maps.services.Status.OK ? data : [];
      /* 집 주소처럼 가게 이름이 아닌 것은 주소 검색으로도 찾기 */
      geocoder.addressSearch(q, (r, st) => {
        const ad = st === kakao.maps.services.Status.OK ? r.map(a => ({place_name: a.address_name,
          road_address_name: (a.road_address && a.road_address.address_name) || '', address_name: a.address_name,
          x: a.x, y: a.y, category_name: '주소', category_group_code: '', phone: '', place_url: ''})) : [];
        res([...ad, ...kw]);
      });
    }, opt);
  });
}
/* 주소 글자만 있을 때 위치(좌표) 찾기 */
function addrToCoord(addr){
  return new Promise(res => {
    if(!geocoder || !addr) return res(null);
    geocoder.addressSearch(addr, (r, st) => res(st === kakao.maps.services.Status.OK && r[0] ? {lat: Number(r[0].y), lng: Number(r[0].x)} : null));
  });
}
function clearOverlays(){ overlays.forEach(o => o.setMap(null)); overlays = []; if(routeLine){ routeLine.setMap(null); routeLine = null; } }
function pinEl(cls, color, text, label, onClick){
  const el = document.createElement('div'); el.className = cls; el.style.background = color;
  el.innerHTML = `${text || ''}<span class="lbl">${esc(label)}</span>`;
  el.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  return el;
}
function renderMap(){
  if(!map || !mapVisible()) return;
  clearOverlays();
  const banner = $('#routeBanner'), bounds = new kakao.maps.LatLngBounds(); let any = false;
  const g = S.route && groupByKey(S.route.key);
  if(S.route && !g) S.route = null;
  if(g){
    /* 여행(여러 날)도 하루 묶음도 같은 방법: 날짜·시간 순 번호 핀 + 선. 번호는 여행 상세 목록과 같음 */
    $('#mapCats').hidden = true;
    const stops = g.vs.map((v, i) => ({v, i, p: placeById(v.placeId)})).filter(x => x.p && x.p.lat != null);
    banner.hidden = false; banner.innerHTML = `<span>${esc(groupTitle(g))} · ${fmtRange(g.start, g.end)} · ${g.vs.length}곳</span><button id="rbClose">✕ 닫기</button>`;
    $('#rbClose').onclick = () => { S.route = null; S.fit = true; renderMap(); };
    const path = [];
    stops.forEach(x => { const pos = new kakao.maps.LatLng(x.p.lat, x.p.lng); path.push(pos); bounds.extend(pos); any = true;
      overlays.push(new kakao.maps.CustomOverlay({map, position: pos, yAnchor: .5, clickable: true, zIndex: 3,
        content: pinEl('npin', catColor(x.p.category), String(x.i+1), x.p.name, () => openPlace(x.p.id))})); });
    if(path.length > 1) routeLine = new kakao.maps.Polyline({map, path, strokeWeight: 4, strokeColor: '#1F6F5C', strokeOpacity: .85, strokeStyle: 'solid'});
  } else {
    $('#mapCats').hidden = false; banner.hidden = true;
    filtered().filter(p => p.lat != null).forEach(p => { const pos = new kakao.maps.LatLng(p.lat, p.lng); bounds.extend(pos); any = true;
      overlays.push(new kakao.maps.CustomOverlay({map, position: pos, yAnchor: .5, clickable: true,
        content: pinEl('pin', catColor(p.category), '', p.name, () => openPlace(p.id))})); });
  }
  if(S.fit && any){ map.setBounds(bounds, 60, 40, 90, 40); if(map.getLevel() < 4) map.setLevel(4); }
  S.fit = false;
}
function focusPlace(p){ if(!map) return; map.relayout(); map.setLevel(4); map.setCenter(new kakao.maps.LatLng(p.lat, p.lng)); S.fit = false; renderMap(); }
function onMapClick(latlng){
  if(S.route) return;
  pickLatLng = latlng;
  if(tempOverlay) tempOverlay.setMap(null);
  const el = document.createElement('div'); el.className = 'npin'; el.style.background = '#18221F'; el.textContent = '＋';

  });
  $('#pickNo').onclick = clearPick;
  $('#pickYes').onclick = () => openEditor(null, {prefill: {lat: latlng.getLat(), lng: latlng.getLng(), address: addr}});
}
function clearPick(){ $('#pickBar').hidden = true; if(tempOverlay){ tempOverlay.setMap(null); tempOverlay = null; } }

function moveToMyLocation(){
  if(isLocating) return;
  if(!navigator.geolocation){
    toast('이 기기에서는 위치 정보를 지원하지 않아요.');
    return;
  }
  if(!map){
    toast('지도가 아직 준비되지 않았어요.');
    return;
  }
  const btn = $('#btnMyLocation');
  isLocating = true;
  if(btn) btn.classList.add('loading');
  toast('현재 위치를 찾는 중…');

  navigator.geolocation.getCurrentPosition(
    pos => {
      isLocating = false;
      if(btn) btn.classList.remove('loading');
      S.myCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, ts: Date.now() };
      showMyLocation(pos.coords.latitude, pos.coords.longitude);
    },
    err => {
      isLocating = false;
      if(btn) btn.classList.remove('loading');
      let msg = '현재 위치를 가져오지 못했어요.';
      if(err.code === 1){
        msg = '위치 권한이 꺼져 있어 현재 위치를 찾을 수 없어요. 브라우저 설정에서 위치 권한을 켜 주세요.';
      } else if(err.code === 2){
        msg = '위치 정보를 가져올 수 없어요. GPS 상태를 확인해 주세요.';
      } else if(err.code === 3){
        msg = '위치 정보를 가져오는 데 시간이 초과되었어요. 다시 시도해 주세요.';
      }
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function showMyLocation(lat, lng){
  if(!map) return;
  const latlng = new kakao.maps.LatLng(lat, lng);
  if(myLocationOverlay){
    myLocationOverlay.setMap(null);
    myLocationOverlay = null;
  }
  const el = document.createElement('div');
  el.className = 'my-pos-marker';
  el.innerHTML = '<div class="pulse"></div><div class="dot"></div>';
  myLocationOverlay = new kakao.maps.CustomOverlay({
    map: map,
    position: latlng,
    yAnchor: 0.5,
    xAnchor: 0.5,
    zIndex: 10,
    content: el
  });
  S.fit = false;
  map.setLevel(4);
  map.panTo(latlng);
  toast('현재 위치로 이동했습니다.');
}

const myLocBtn = $('#btnMyLocation');
if(myLocBtn) myLocBtn.onclick = moveToMyLocation;

/* ───────── 탭 ───────── */
const wideMQ = window.matchMedia('(min-width: 900px)');
const isWide = () => wideMQ.matches;
const mapVisible = () => isWide() || S.tab === 'map';
function applyLayout(){
  document.body.classList.toggle('wide', isWide());
  if(isWide() && S.tab === 'map') S.tab = 'list';
  switchTab(S.tab);
}
wideMQ.addEventListener ? wideMQ.addEventListener('change', applyLayout) : wideMQ.addListener(applyLayout);
/* 지도 탭으로 가거나(좁은 화면), 오른쪽 지도를 그대로 쓰기(넓은 화면) */
function showMap(){ if(isWide()){ if(map){ map.relayout(); renderMap(); } } else switchTab('map'); }
function switchTab(t){
  if(isWide() && t === 'map') t = 'list';
  S.tab = t;
  if(isWide() && t === 'list' && S.route){ S.route = null; S.fit = true; }
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  ['list','map','date'].forEach(k => $('#view-' + k).hidden = (k !== t));
  if(!mapVisible()) clearPick();
  if(t === 'map'){ S.fit = true; }
  if(mapVisible() && map){ setTimeout(() => { map.relayout(); renderMap(); }, 30); }
  if(t === 'date') renderTrips();
  $('#fab').textContent = t === 'date' ? '＋ 여행 추가' : '＋ 장소 추가';
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if(b) switchTab(b.dataset.tab); });
$('#fab').onclick = () => S.tab === 'date' ? openTripEditor(null) : openEditor(null);

function renderAll(){ renderCats(); renderList(); if(S.tab === 'date') renderTrips(); renderMap(); }

/* ───────── 설정 · 한꺼번에 추가 · 백업 ───────── */
function openSettings(){
  const def = lsGet('ms-navi','tmap');
  const kakaoKey = lsGet('ms-kakao-key','');
  const criteriaText = getCriteriaText();
  openSheet(`<div class="sh-title"><h2>설정</h2></div>
    <div class="card"><h3>저장소</h3>
      <p style="margin:0">${online() ? '구글 시트에 저장 중 — 휴대폰·맥북에서 같은 목록이 보여요.' : '<b>아직 이 기기에만 저장돼요.</b> 처음 받은 <b>연결 링크</b>로 한 번 열면 모든 기기에서 같이 보입니다.'}</p>
      <p class="hint">장소 ${places.length}곳 · 날짜 기록 ${visits.length}개${outbox.length ? ` · 올리지 못한 변경 ${outbox.length}건` : ''}</p>
      ${online() ? '<button class="btn small" id="stSync">지금 다시 불러오기</button>' : ''}
    </div>
    <div class="card"><h3>출발 버튼에 쓸 내비 (이 기기)</h3>
      <div class="chips" id="stNavi" style="flex-wrap:wrap;padding:0">${Object.keys(NAVS).map(k=>`<button class="chip ${k===def?'on':''}" data-n="${k}">${NAVS[k]}</button>`).join('')}</div>
    </div>
    <div class="card"><h3>카카오 지역 검색 키</h3>
      <p class="hint" style="margin-top:0">카카오 개발자 콘솔에서 무료 REST API 키를 받아 등록하면, 현재 위치 주변 장소를 기준으로 최적의 가게를 추천해 드려요.</p>
      <div class="guide-box">
        <b>무료 REST API 키 받는 4단계</b>
        <ol>
          <li><a href="https://developers.kakao.com" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">카카오 개발자 사이트</a> 로그인</li>
          <li><b>[내 애플리케이션]</b> → <b>[애플리케이션 추가하기]</b> (앱 이름 자유 입력)</li>
          <li>생성된 앱의 <b>[앱 키]</b> 메뉴에서 <b>'REST API 키'</b> 복사 (일 10만 건 무료)</li>
          <li>아래 칸에 붙여넣고 <b>[키 저장]</b> 클릭</li>
        </ol>
      </div>
      <div class="field" style="margin-top:8px">
        <input id="stKakaoKey" type="text" placeholder="카카오 REST API 키를 입력하세요" value="${esc(kakaoKey)}">
      </div>
      <button class="btn small primary" id="btnSaveKakaoKey" style="margin-top:8px">키 저장</button>
    </div>
    <div class="card"><h3>추천 기준 관리 (criteria.md)</h3>
      <p class="hint" style="margin-top:0">카테고리별 한 줄 기준(거리, 분위기, 가성비 등)에 맞춰 agy가 현재 위치 근처 최적의 가게 3곳을 선별합니다.</p>
      <div class="field" style="margin-top:8px">
        <textarea id="stCriteria" rows="7" style="font-family:monospace;font-size:13px;line-height:1.5" placeholder="카테고리명 — 조건들">${esc(criteriaText)}</textarea>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn small primary" id="btnSaveCriteria">기준 저장</button>
        <button class="btn small" id="btnResetCriteria">기본 기준 불러오기</button>
      </div>
    </div>
    <div class="card"><h3>분류 관리 <button class="btn small" id="catAdd">＋ 분류 추가</button></h3>
      <div id="catList"></div>
      <p class="hint">분류를 지우면 그 분류의 장소들은 "기타"로 옮겨져요.</p>
    </div>
    <div class="card"><h3>여러 곳 한꺼번에 추가</h3>
      <p class="hint" style="margin-top:0">내비 즐겨찾기에 있는 이름을 한 줄에 하나씩 붙여넣으세요. 하나씩 검색해서 위치를 찾아 드려요.</p>
      <div class="field" style="margin-top:6px"><textarea id="bulkText" placeholder="스타벅스 광화문점&#10;경복궁&#10;이마트 성수점"></textarea></div>
      <button class="btn small primary" id="bulkGo" style="margin-top:8px">찾기</button>
      <ul id="bulkRes" class="results bulk" hidden></ul>
      <div id="bulkCatBox" hidden>
        <p class="hint" style="margin:10px 0 4px">체크한 곳을 어느 분류에 넣을까요?</p>
        <div class="chips" id="bulkCats" style="flex-wrap:wrap;padding:0"><button type="button" class="chip on" data-c="">자동 (카카오 분류대로)</button>${allCats().map(c=>`<button type="button" class="chip" data-c="${esc(c)}"><i style="background:${catColor(c)}"></i>${esc(c)}</button>`).join('')}</div>
      </div>
      <button class="btn small primary" id="bulkAdd" style="margin-top:8px" hidden></button>
    </div>
    <div class="card"><h3>백업</h3>
      <div class="row">
        <button class="btn small" id="expMd">옵시디언용 마크다운 내보내기</button>
        <button class="btn small" id="expJson">전체 백업 파일 내보내기</button>
        <label class="btn small" for="impJson">백업 파일 가져오기</label><input id="impJson" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="actions"><button class="btn" data-close>닫기</button></div>`);
  const body = $('#sheetBody');
  const sy = body.querySelector('#stSync'); if(sy) sy.onclick = async () => { await pull(); toast('불러왔어요'); openSettings(); };
  /* 카카오 키 및 추천 기준 저장 */
  const btnSaveKey = body.querySelector('#btnSaveKakaoKey');
  if(btnSaveKey){
    btnSaveKey.onclick = () => {
      const k = body.querySelector('#stKakaoKey').value.trim();
      lsSet('ms-kakao-key', k);
      toast(k ? '카카오 지역 검색 키를 저장했어요' : '카카오 키를 비웠어요');
      if(S.cat && S.cat !== '전체') fetchRecommendations(S.cat);
    };
  }
  const btnSaveCrit = body.querySelector('#btnSaveCriteria');
  if(btnSaveCrit){
    btnSaveCrit.onclick = () => {
      const c = body.querySelector('#stCriteria').value.trim();
      if(!c){ toast('기준 내용을 입력해 주세요'); return; }
      lsSet('ms-criteria', c);
      toast('추천 기준을 저장했어요');
      if(S.cat && S.cat !== '전체') fetchRecommendations(S.cat);
    };
  }
  const btnResetCrit = body.querySelector('#btnResetCriteria');
  if(btnResetCrit){
    btnResetCrit.onclick = () => {
      body.querySelector('#stCriteria').value = DEFAULT_CRITERIA;
      lsSet('ms-criteria', DEFAULT_CRITERIA);
      toast('기본 추천 기준으로 되돌렸어요');
      if(S.cat && S.cat !== '전체') fetchRecommendations(S.cat);
    };
  }
  /* 분류 관리 */
  const drawCats = () => {
    const counts = {}; places.forEach(p => counts[p.category] = (counts[p.category]||0) + 1);
    body.querySelector('#catList').innerHTML = cats.map((c, i) => `<div class="vrow" data-ci="${i}">
      <button class="cdot" data-color style="background:${c.color}" aria-label="색 바꾸기"></button>
      <span class="vn" style="font-weight:700;align-self:center">${esc(c.name)} <small style="color:var(--muted);font-weight:400">${counts[c.name]||0}곳</small></span>
      <button data-up aria-label="위로" ${i===0?'disabled':''}>↑</button><button data-down aria-label="아래로" ${i===cats.length-1?'disabled':''}>↓</button>
      <button data-ren aria-label="이름 바꾸기">✎</button><button data-del aria-label="지우기">✕</button></div>`).join('');
  };
  drawCats();
  const renameCat = (i) => {
    const old = cats[i].name;
    openSheet(`<div class="sh-title"><h2>분류 이름 바꾸기</h2></div>
      <div class="field"><label for="cnName">이름</label><input id="cnName" value="${esc(old)}"></div>
      <div class="field"><label>색</label><div class="chips" id="cnColors" style="flex-wrap:wrap;padding:0">${PALETTE.map(h=>`<button type="button" class="cdot big ${h===cats[i].color?'on':''}" data-h="${h}" style="background:${h}"></button>`).join('')}</div></div>
      <div class="actions"><button class="btn" id="cnCancel">취소</button><button class="btn primary" id="cnSave">저장</button></div>`);
    const b2 = $('#sheetBody'); let color = cats[i].color;
    b2.querySelector('#cnColors').onclick = e => { const b = e.target.closest('[data-h]'); if(!b) return; color = b.dataset.h; b2.querySelectorAll('.cdot').forEach(x => x.classList.toggle('on', x === b)); };
    b2.querySelector('#cnCancel').onclick = openSettings;
    b2.querySelector('#cnSave').onclick = () => {
      const nn = b2.querySelector('#cnName').value.trim(); if(!nn){ toast('이름을 넣어 주세요'); return; }
      if(nn !== old && cats.some((c, j) => j !== i && c.name === nn)){ toast('같은 이름의 분류가 이미 있어요'); return; }
      cats[i] = {name:nn, color};
      if(nn !== old) places.forEach(p => { if(p.category === old){ p.category = nn; queue('upsertPlace', p); } });
      saveCats(); openSettings(); toast('바꿨어요');
    };
  };
  body.querySelector('#catAdd').onclick = () => {
    const used = new Set(cats.map(c => c.color));
    cats.push({name:'새 분류', color: PALETTE.find(h => !used.has(h)) || PALETTE[cats.length % PALETTE.length]});
    renameCat(cats.length - 1);
  };
  body.querySelector('#catList').onclick = e => {
    const row = e.target.closest('[data-ci]'); if(!row) return; const i = Number(row.dataset.ci);
    if(e.target.closest('[data-up]')){ [cats[i-1], cats[i]] = [cats[i], cats[i-1]]; saveCats(); drawCats(); }
    else if(e.target.closest('[data-down]')){ [cats[i+1], cats[i]] = [cats[i], cats[i+1]]; saveCats(); drawCats(); }
    else if(e.target.closest('[data-ren]') || e.target.closest('[data-color]')) renameCat(i);
    else if(e.target.closest('[data-del]')){
      const btn = e.target.closest('[data-del]');
      if(!btn.dataset.armed){ btn.dataset.armed = 1; btn.textContent = '한 번 더'; return; }
      const name = cats[i].name;
      if(cats.length <= 1){ toast('분류는 하나 이상 있어야 해요'); return; }
      cats.splice(i, 1);
      const fallback = cats.find(c => c.name === '기타') ? '기타' : cats[0].name;
      places.forEach(p => { if(p.category === name){ p.category = fallback; queue('upsertPlace', p); } });
      saveCats(); drawCats(); toast(`"${name}" 분류를 지웠어요`);
    }
  };
  body.querySelector('#stNavi').onclick = e => { const b = e.target.closest('[data-n]'); if(!b) return; lsSet('ms-navi', b.dataset.n);
    body.querySelectorAll('#stNavi .chip').forEach(x => x.classList.toggle('on', x === b)); toast(`출발 버튼: ${NAVS[b.dataset.n]}`); };
  let bulk = [];
  body.querySelector('#bulkGo').onclick = async () => {
    const lines = body.querySelector('#bulkText').value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!lines.length) return;
    if(!svcPlaces){ toast('카카오 지도가 연결돼야 검색할 수 있어요'); return; }
    const ul = body.querySelector('#bulkRes'); ul.hidden = false; ul.innerHTML = '<li>찾는 중…</li>'; bulk = [];
    for(const line of lines){ const r = await kakaoSearch(line); bulk.push({line, d: r && r[0]}); await new Promise(r => setTimeout(r, 120)); }
    ul.innerHTML = bulk.map((b, i) => b.d
      ? `<li><input type="checkbox" checked data-b="${i}" id="bk${i}"><label for="bk${i}">${esc(b.d.place_name)}<small>${esc(b.d.road_address_name||b.d.address_name)} · ${esc(KAKAO_GROUP[b.d.category_group_code]||'기타')} · 입력: ${esc(b.line)}</small></label></li>`
      : `<li style="color:var(--muted)">못 찾음: ${esc(b.line)}</li>`).join('');
    const add = body.querySelector('#bulkAdd'); add.hidden = false; add.textContent = `체크한 곳 추가`;
    body.querySelector('#bulkCatBox').hidden = false;
  };
  let bulkCat = '';
  body.querySelector('#bulkCats').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; bulkCat = b.dataset.c;
    body.querySelectorAll('#bulkCats .chip').forEach(x => x.classList.toggle('on', x === b)); };
  body.querySelector('#bulkAdd').onclick = () => {
    const ps = []; const t = nowIso();
    body.querySelectorAll('#bulkRes input[data-b]:checked').forEach(cb => { const d = bulk[cb.dataset.b].d;
      ps.push(normP({id:uid(), name:d.place_name, category:bulkCat || KAKAO_GROUP[d.category_group_code] || '기타', address:d.road_address_name||d.address_name,
        lat:d.y, lng:d.x, phone:d.phone, url:d.place_url, memo:'', rating:0, createdAt:t, updatedAt:t})); });
    if(!ps.length) return;
    importMany(ps, []); closeSheet(); toast(`${ps.length}곳 추가했어요`);
  };
  const dl = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  body.querySelector('#expJson').onclick = () => dl(`나의공간-백업-${today()}.json`, JSON.stringify({places, visits, trips}, null, 2), 'application/json');
  body.querySelector('#expMd').onclick = () => dl(`나의공간-${today()}.md`, toMarkdown(), 'text/markdown');
  body.querySelector('#impJson').onchange = async e => { const f = e.target.files[0]; if(!f) return;
    try{ const d = JSON.parse(await f.text()); importMany((d.places||[]).map(normP), (d.visits||[]).map(normV));
      if(Array.isArray(d.trips) && d.trips.length){ d.trips.map(normT).filter(t => t.start).forEach(t => { const i = trips.findIndex(x => x.id === t.id); if(i < 0) trips.push(t); else trips[i] = t; }); saveTrips(); }
      closeSheet(); toast('가져왔어요'); }
    catch(err){ toast('백업 파일을 읽지 못했어요'); } };
}
function toMarkdown(){
  const out = [`# 나의 공간`, ``, `내보낸 날: ${today()}`, ``];
  for(const c of allCats()){ const ps = places.filter(p => p.category === c).sort((a,b)=>a.name.localeCompare(b.name,'ko')); if(!ps.length) continue;
    out.push(`## ${c}`, '');
    for(const p of ps){ out.push(`### ${p.name}`);
      if(p.address) out.push(`- 주소: ${p.address}`);
      if(p.rating) out.push(`- 별점: ${starText(p.rating)}`);
      if(p.lat != null) out.push(`- 지도: https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}`);
      if(p.memo) out.push(`- 메모: ${p.memo.replace(/\n/g, ' ')}`);
      visits.filter(v => v.placeId === p.id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(v => out.push(`- ${v.date}${v.time?' '+v.time:''}${v.note?' — '+v.note.replace(/\n/g,' '):''}`));
      out.push(''); } }
  const tg = tripGroups().filter(g => g.trip);
  if(tg.length){ out.push(`## 여행`, '');
    for(const g of tg){ out.push(`### ${groupTitle(g)} (${g.start}${g.end !== g.start ? ' ~ ' + g.end : ''})`);
      if(g.trip.note) out.push(`- 메모: ${g.trip.note.replace(/\n/g, ' ')}`);
      g.vs.forEach((v, i) => out.push(`${i+1}. ${v.date}${v.time?' '+v.time:''} ${placeName(v)}${v.note?' — '+v.note.replace(/\n/g,' '):''}`));
      out.push(''); } }
  return out.join('\n');
}
